name: Build

on:
  push:
    branches:
      - 4.x
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v7.0.0
      - name: Run build-wrapper
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake ..
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_JAVA=OFF -DBUILD_opencv_java=OFF .
          cd ..
      - name: Generate SBOM for bundled deps (ScanCode / SPDX JSON)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir scancode-toolkit==32.4.1
          scancode --package --spdx-tv sbom-3rdparty.spdx 3rdparty
      - name: Dump SBOM to logs
        shell: bash
        run: |
          set -euo pipefail
          echo "SBOM file: sbom-3rdparty.spdx"
          echo "SBOM size (bytes): $(wc -c < sbom-3rdparty.spdx)"
          echo "----- BEGIN SBOM (truncated to first 200000 bytes) -----"
          head -c 200000 sbom-3rdparty.spdx || true
          echo
          echo "----- END SBOM -----"
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
        with:
          args: >
            -X
            -Dsonar.sca.enabled=true
            -Dsonar.sca.sbomImportPaths=sbom-3rdparty.spdx
