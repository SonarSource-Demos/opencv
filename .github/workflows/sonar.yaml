name: Build

on:
  push:
    branches:
      - 4.x
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v7.0.0
      - name: Run build-wrapper
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake ..
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_JAVA=OFF -DBUILD_opencv_java=OFF .
          cd ..
      - name: Generate SBOM (Syft / CycloneDX)
        uses: anchore/sbom-action@v0.21.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Prune SBOM noise
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("sbom.cdx.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          deny_types = {"binary", "github-action", "java-archive"}

          def syft_pkg_type(component: dict) -> str | None:
            for prop in component.get("properties") or []:
              if prop.get("name") == "syft:package:type":
                return prop.get("value")
            return None

          comps = d.get("components") or []
          before = len(comps)
          kept = []
          kept_refs = set()

          for c in comps:
            t = syft_pkg_type(c)
            # Only keep components that Syft actually identified as a package.
            # This drops generic "file" components that add noise but no dependency signal.
            if not t:
              continue
            if t in deny_types:
              continue
            kept.append(c)
            ref = c.get("bom-ref")
            if ref:
              kept_refs.add(ref)

          d["components"] = kept

          # Prune dependency graph to match kept components (if present)
          deps = d.get("dependencies") or []
          if deps:
            new_deps = []
            for dep in deps:
              ref = dep.get("ref")
              if ref and ref not in kept_refs:
                continue
              depends_on = dep.get("dependsOn") or []
              dep["dependsOn"] = [r for r in depends_on if r in kept_refs]
              new_deps.append(dep)
            d["dependencies"] = new_deps

          p.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          after = len(d.get("components") or [])
          print(f"Pruned SBOM components: {before} -> {after} (dropped types: {sorted(deny_types)})")
          PY
      - name: Dump SBOM to logs
        shell: bash
        run: |
          set -euo pipefail
          echo "SBOM file: sbom.cdx.json"
          echo "SBOM size (bytes): $(wc -c < sbom.cdx.json)"
          echo "----- BEGIN SBOM (truncated to first 200000 bytes) -----"
          head -c 200000 sbom.cdx.json || true
          echo
          echo "----- END SBOM -----"
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
        with:
          args: >
            -X
            -Dsonar.sca.enabled=true
            -Dsonar.sca.sbomImportPaths=sbom.cdx.json
